name: Opening-core research audit

on:
  pull_request:
    paths:
      - "services/opening_core_audit_v1.py"
      - "services/selftest_opening_core_audit_v1.py"
      - "run_qmt_l1_60s_walkforward.bat"
      - ".github/workflows/opening_core_audit_ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "scikit-learn>=1.5,<2.0" "joblib>=1.4" "pandas>=2.0" "requests>=2.31" "certifi>=2024.2"
      - name: Compile
        run: python -m py_compile services/opening_core_audit_v1.py services/selftest_opening_core_audit_v1.py
      - name: Deterministic self-test
        env:
          PYTHONPATH: .
        run: python services/selftest_opening_core_audit_v1.py
