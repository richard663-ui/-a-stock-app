name: Production quality check

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

jobs:
  linux-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Repository hygiene (no secrets, no runtime code downloads)
        run: python tools/check_repo_hygiene.py
      - name: Compile Python source
        run: python -m compileall -q app_1.py app_v18_live.py modules services deploy tools tests
      - name: Verify required production files
        run: |
          for f in app_1.py app_v18_live.py modules/cloud_bridge.py modules/direction_v18.py \
                   modules/level2_engine.py modules/qmt_level2.py modules/setup_vwap.py \
                   modules/prediction_journal.py services/qmt_cloud_bridge.py services/collection_monitor.py \
                   deploy/install_runtime.ps1 deploy/verify_install.py deploy/services.json; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Verify fragment refresh architecture
        run: |
          grep -q "from app_v18_live import" app_1.py
          grep -q "st.fragment" app_v18_live.py
          ! grep -q "streamlit_autorefresh" app_v18_live.py
          ! grep -q "streamlit-autorefresh" requirements.txt
      - name: Install test dependencies
        run: python -m pip install -q pandas numpy requests certifi "scikit-learn>=1.5,<2.0" "joblib>=1.4"
      - name: Verify Streamlit-Cloud-safe Level-2 import without xtquant
        run: |
          python - <<'PY'
          from modules.qmt_level2 import QMTLevel2Manager, XTQUANT_OK
          assert XTQUANT_OK is False, 'CI unexpectedly has xtquant; cloud-safe absence test is not exercising fallback'
          manager = QMTLevel2Manager()
          status = manager.switch('000400.SZ')
          assert status['runtime_available'] is False
          snap = manager.snapshot()
          assert snap['summary']['ok'] is False
          print('[PASS] qmt_level2 imports and degrades safely without xtquant')
          PY
      - name: Unit tests (deployment, collection health, costs, splits, auth, market alpha)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Deterministic self-tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python services/v18_selftest.py
          python -m services.selftest_monitoring_integrity
          python -m services.selftest_event_evidence
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Mobile API, direction standard and edge security tests
        run: |
          node tests/test_mobile_integrity.mjs
          node tests/test_direction_standard.mjs
          node tests/test_mobile_security.mjs

  windows-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q pandas numpy requests certifi "scikit-learn>=1.5,<2.0" "joblib>=1.4"
      - name: Compile Python source
        run: python -m compileall -q app_1.py app_v18_live.py modules services deploy tools tests
      - name: Unit tests on Windows (junction-based integrity checks included)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Deterministic V18 self-test on Windows
        run: python services/v18_selftest.py
      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($f in @('services/start_monitor.ps1', 'deploy/install_runtime.ps1', 'deploy/restore_pre_pinning_runtime.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $f), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($f + ': ' + ($errors | Out-String)) }
          }
