name: Python syntax check

on:
  push:
    branches: [qmt-v17-experiment]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python files
        run: python -m compileall -q .
