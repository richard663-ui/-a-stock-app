name: MACD event study

on:
  workflow_dispatch:
  push:
    branches: [level2-v18]
    paths:
      - 'services/macd_event_study.py'
      - 'modules/data_sources.py'
      - '.github/workflows/macd-study.yml'

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: level2-v18
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests streamlit baostock
      - name: Run 10-stock MACD study
        run: python services/macd_event_study.py
      - name: Show summaries
        run: |
          echo '--- confirmed crosses ---'
          cat runtime/macd_event_study_summary.csv
          echo '--- pre-cross setups ---'
          cat runtime/macd_precross_summary.csv
      - name: Upload research outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macd-event-study
          path: |
            runtime/macd_event_study_events.csv
            runtime/macd_event_study_summary.csv
            runtime/macd_precross_events.csv
            runtime/macd_precross_summary.csv
      - name: Commit reproducible summaries
        run: |
          mkdir -p research
          cp runtime/macd_event_study_summary.csv research/macd_event_study_summary.csv
          cp runtime/macd_precross_summary.csv research/macd_precross_summary.csv
          cp runtime/macd_event_study_events.csv research/macd_event_study_events.csv
          cp runtime/macd_precross_events.csv research/macd_precross_events.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/
          git diff --cached --quiet || git commit -m 'Update MACD event-study results'
          git push origin HEAD:level2-v18
