name: Research Python syntax

on:
  pull_request:
    paths:
      - "services/qmt_l2_training_recorder_v2.py"
      - "services/qmt_l2_training_recorder_v3.py"
      - "services/train_l2_60s_model_v2.py"
      - "services/l2_training_status_v2.py"
      - "services/train_l1_60s_model_v2.py"
      - "services/train_l1_60s_model_v3.py"
      - "services/train_l1_60s_model_v4.py"
      - "services/train_l1_60s_model_v4r.py"
      - "services/train_l1_60s_model_v4rx_observed_label.py"
      - "services/train_l1_60s_model_v5_challenger.py"
      - "services/train_l1_60s_model_v5r.py"
      - "services/train_l1_60s_model_v6_exec_aligned.py"
      - "services/l1_v6_shadow_runner_v1.py"
      - "services/l1_ml_autotrain_daemon_v2.py"
      - "services/l1_ml_autotrain_daemon_v3.py"
      - "services/qmt_walkforward_pandas_compat.py"
      - "services/qmt_l1_60s_walkforward_v1.py"
      - "services/qmt_l1_60s_walkforward_v2.py"
      - "services/qmt_l1_60s_walkforward_v3.py"
      - "services/imacd_research_audit_v1.py"
      - "services/run_imacd_audit_v1.py"
      - "services/v4r_imacd_filter_audit_v1.py"
      - "services/v4r_meta_label_audit_v1.py"
      - "services/selftest_v4r_imacd_filter_audit_v1.py"
      - "services/selftest_v4r_meta_label_audit_v1.py"
      - "services/selftest_imacd_research_v1.py"
      - "services/selftest_l1_trainer_v3.py"
      - "services/selftest_l1_trainer_v4.py"
      - "services/selftest_l1_trainer_v4r.py"
      - "services/selftest_l1_trainer_v4rx_observed_label.py"
      - "services/selftest_l1_trainer_v5.py"
      - "services/selftest_l1_trainer_v6.py"
      - "services/selftest_l1_v6_shadow_runner_v1.py"
      - "services/selftest_qmt_l1_walkforward_v1.py"
      - "services/selftest_qmt_l1_walkforward_v2.py"
      - "services/selftest_qmt_l1_walkforward_v3.py"
      - "run_qmt_l1_60s_walkforward.bat"
      - "update_l1_baseline_pipeline.bat"
      - "hotfix_morning_20260904.bat"
      - "install_v6_prospective_shadow_20260905.bat"
      - ".github/workflows/research_python_syntax.yml"

jobs:
  pycompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research ML dependencies
        run: python -m pip install --disable-pip-version-check "scikit-learn>=1.5,<2.0" "joblib>=1.4" "pandas>=2.0" "requests>=2.31" "certifi>=2024.2"
      - name: Compile research Python files
        run: |
          python -m py_compile \
            services/qmt_l2_training_recorder_v2.py \
            services/qmt_l2_training_recorder_v3.py \
            services/train_l2_60s_model_v2.py \
            services/l2_training_status_v2.py \
            services/train_l1_60s_model_v3.py \
            services/train_l1_60s_model_v4.py \
            services/train_l1_60s_model_v4r.py \
            services/train_l1_60s_model_v4rx_observed_label.py \
            services/train_l1_60s_model_v5_challenger.py \
            services/train_l1_60s_model_v5r.py \
            services/train_l1_60s_model_v6_exec_aligned.py \
            services/l1_v6_shadow_runner_v1.py \
            services/l1_ml_autotrain_daemon_v2.py \
            services/qmt_walkforward_pandas_compat.py \
            services/qmt_l1_60s_walkforward_v1.py \
            services/qmt_l1_60s_walkforward_v2.py \
            services/qmt_l1_60s_walkforward_v3.py \
            services/imacd_research_audit_v1.py \
            services/run_imacd_audit_v1.py \
            services/v4r_imacd_filter_audit_v1.py \
            services/v4r_meta_label_audit_v1.py \
            services/selftest_v4r_imacd_filter_audit_v1.py \
            services/selftest_v4r_meta_label_audit_v1.py \
            services/selftest_imacd_research_v1.py \
            services/selftest_l1_trainer_v3.py \
            services/selftest_l1_trainer_v4r.py \
            services/selftest_l1_trainer_v4rx_observed_label.py \
            services/selftest_l1_trainer_v5.py \
            services/selftest_l1_trainer_v6.py \
            services/selftest_l1_v6_shadow_runner_v1.py \
            services/selftest_qmt_l1_walkforward_v1.py \
            services/selftest_qmt_l1_walkforward_v2.py \
            services/selftest_qmt_l1_walkforward_v3.py
      - name: Run synthetic L1 V3 trainer end-to-end test
        env:
          PYTHONPATH: .
        run: python services/selftest_l1_trainer_v3.py
      - name: Run synthetic L1 V4R asymmetric trainer end-to-end test
        env:
          PYTHONPATH: .
        run: python services/selftest_l1_trainer_v4r.py
      - name: Run V4R-X observed-bid scoring-label self-test
        env:
          PYTHONPATH: .
        run: python services/selftest_l1_trainer_v4rx_observed_label.py
      - name: Run synthetic L1 V5 robust challenger end-to-end test
        env:
          PYTHONPATH: .
        run: python services/selftest_l1_trainer_v5.py
      - name: Run synthetic L1 V6 execution-aligned challenger end-to-end test
        env:
          PYTHONPATH: .
        run: python services/selftest_l1_trainer_v6.py
      - name: Run prospective V6 observed-bid settlement self-test
        env:
          PYTHONPATH: .
        run: python services/selftest_l1_v6_shadow_runner_v1.py
      - name: Run QMT historical replay leakage/session self-test
        env:
          PYTHONPATH: .
        run: python services/selftest_qmt_l1_walkforward_v1.py
      - name: Run QMT historical audit V2 parity/null self-test
        env:
          PYTHONPATH: .
        run: python services/selftest_qmt_l1_walkforward_v2.py
      - name: Run QMT historical V3 same-fold V4R/V5R/V6 self-test
        env:
          PYTHONPATH: .
        run: python services/selftest_qmt_l1_walkforward_v3.py
      - name: Run iMACD causal-state and promotion-gate self-test
        env:
          PYTHONPATH: .
        run: python services/selftest_imacd_research_v1.py
      - name: Run V4R x iMACD validation-only filter self-test
        env:
          PYTHONPATH: .
        run: python services/selftest_v4r_imacd_filter_audit_v1.py
      - name: Run V4R validation-split meta-label self-test
        env:
          PYTHONPATH: .
        run: python services/selftest_v4r_meta_label_audit_v1.py
