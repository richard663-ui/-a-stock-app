name: Direction asymmetry research quality

on:
  pull_request:
    paths:
      - "services/v4r_direction_asymmetry_audit_v1.py"
      - "services/selftest_v4r_direction_asymmetry_audit_v1.py"
      - "run_qmt_l1_60s_walkforward.bat"
      - ".github/workflows/direction_asymmetry_quality.yml"

jobs:
  research-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check "scikit-learn>=1.5,<2.0" "joblib>=1.4" "pandas>=2.0" "numpy>=1.26"
      - name: Compile direction-asymmetry audit
        run: python -m py_compile services/v4r_direction_asymmetry_audit_v1.py services/selftest_v4r_direction_asymmetry_audit_v1.py
      - name: Run direction-asymmetry deterministic self-test
        env:
          PYTHONPATH: .
        run: python services/selftest_v4r_direction_asymmetry_audit_v1.py
